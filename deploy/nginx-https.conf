# Production reverse-proxy example for BMS (DS-SEC / BMS-SR-001).
# Install certificates outside this repository; never commit certificate or key files.
server {
    listen 443 ssl;
    server_name bms.example.invalid;

    ssl_certificate     /etc/ssl/bms/fullchain.pem;
    ssl_certificate_key /etc/ssl/bms/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Optional separate HTTP listener: redirecting is useful, but TLS enforcement is
# provided by the 443 listener above and its explicit protocol allow-list.
server {
    listen 80;
    server_name bms.example.invalid;
    return 301 https://$host$request_uri;
}
